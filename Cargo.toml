[package]
name = "telegraph"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing a Linux machine's shell and files to Vibe (stdio + Streamable HTTP)"

[dependencies]
rmcp = { version = "3.10", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
axum = "0.8"

[profile.release]
strip = true
lto = true
